services:
  db:
    image: postgres:16-alpine
    container_name: spot-ifind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: songs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d songs"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: spot-ifind-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/songs
      CSV_PATH: data/combined_spotify_songs.csv
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
